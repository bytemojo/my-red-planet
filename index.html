<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>My Little Red Planet: A Junior Astronaut Mission Trainer</title>
  <script>
    window.__mrpBoot = { delayed: false, appReady: false, coverReady: false };
    window.setTimeout(() => { window.__mrpBoot.delayed = true; window.__mrpBoot.update?.(); }, 900);
  </script>
  <meta name="description" content="My Little Red Planet, a Junior Astronaut Mission Trainer: kids 7-12 run a Mars outpost at Hebrus Valles through a dust storm and a solar storm modelled on real NASA DONKI data. Every choice about power, shielding, air, water and food costs something." />
  <link rel="canonical" href="https://myredplanet.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="My Little Red Planet" />
  <meta property="og:title" content="My Little Red Planet | A Junior Astronaut Mission Trainer" />
  <meta property="og:description" content="Run a Mars outpost through a storm built on real NASA solar flare data. No choice is free." />
  <meta property="og:url" content="https://myredplanet.vercel.app/" />
  <meta property="og:image" content="https://myredplanet.vercel.app/og-image.png" />
  <meta property="og:image:secure_url" content="https://myredplanet.vercel.app/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="Junior astronauts explore a colorful Mars colony with greenhouses beneath the My Little Red Planet title." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="My Little Red Planet | A Junior Astronaut Mission Trainer" />
  <meta name="twitter:description" content="Run a Mars outpost through a storm built on real NASA solar flare data. No choice is free." />
  <meta name="twitter:image" content="https://myredplanet.vercel.app/og-image.png" />
  <meta name="twitter:image:alt" content="Junior astronauts explore a colorful Mars colony with greenhouses beneath the My Little Red Planet title." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="/menu-cover.png" fetchpriority="high" media="(min-width: 621px)" />
  <link rel="preload" as="image" href="/menu-cover-mobile.png" fetchpriority="high" media="(max-width: 620px)" />
  <link rel="stylesheet" href="/src/ui/holo.css" />
</head>
<body>
<div id="app">
  <!-- MENU -->
  <section id="menu" class="screen">
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="menu-inner">
      <h1 class="menu-brand"><img src="/menu-logo.png" alt="My Little Red Planet — Explore Mars and make it your home" width="2046" height="768" fetchpriority="high"></h1>
      <nav class="menu-list" aria-label="Main menu">
        <button class="holo-btn primary" data-act="continue" id="btn-continue" hidden><svg viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z" fill="currentColor"/></svg>Continue</button>
        <button class="holo-btn primary" data-act="play" id="btn-play"><svg viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z" fill="currentColor"/></svg>Episode 1: The Storm</button>
        <button class="holo-btn" data-act="astroquiz" id="btn-astroquiz"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5l2.3 5 5.4.6-4 3.7 1.1 5.4L10 13.4l-4.8 2.8 1.1-5.4-4-3.7 5.4-.6z" fill="currentColor"/></svg>Play Astronaut Quiz</button>
        <button class="holo-btn" data-act="awards"><svg viewBox="0 0 20 20"><path d="M10 2l2.4 5 5.4.7-4 3.7 1 5.4L10 14.2 5.2 16.8l1-5.4-4-3.7 5.4-.7z" fill="currentColor"/></svg>Your awards</button>
        <button class="holo-btn" data-act="wiki"><span data-ic="doc"></span>Living in space: NASA wiki</button>
        <button class="holo-btn" data-act="help"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.6 8a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2.9-1.2 1.8M10 14.2v1.6" fill="none" stroke="currentColor" stroke-width="2"/></svg>Help</button>
        <button class="holo-btn" data-act="settings"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3M4 4l2 2M14 14l2 2M16 4l-2 2M6 14l-2 2" stroke="currentColor" stroke-width="2"/></svg>Settings</button>
      </nav>
    </div>
    <button class="sun-card" id="sun-card" type="button" aria-live="polite" aria-label="Solar forecast loading" aria-busy="true">
      <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.93 4.93l2.12 2.12m9.9 9.9 2.12 2.12m0-14.14-2.12 2.12m-9.9 9.9-2.12 2.12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span id="sun-label">CHECKING</span>
    </button>
    <div id="modal-host"></div>
  </section>
  <button id="sound-toggle" class="sound-toggle" aria-label="Mute all sound" aria-pressed="false"><span aria-hidden="true">♪</span></button>

  <!-- GAME -->
  <section id="game" class="screen" hidden>
    <header id="hud">
      <div class="obj" aria-live="polite">
        <button class="obj-top" id="obj-toggle" aria-expanded="false" aria-controls="obj-drop"><span class="obj-title">Check all 4</span><span class="obj-count" id="obj-count">0/4</span><span class="obj-chev" aria-hidden="true">▾</span></button>
        <div class="obj-drop" id="obj-drop" hidden>
          <div class="chips" id="chips"></div>
          <div class="obj-hint" id="obj-hint"></div>
        </div>
      </div>
      <button class="hud-toggle" id="hud-toggle" aria-expanded="false" aria-controls="hud-panel" aria-label="Show meters"><span class="hud-ico" data-ic="gauge"></span><span class="hud-dot"></span></button>
      <div class="right-hud" id="hud-panel" hidden>
        <button class="meter" data-m="o2" aria-label="Air. Tap for details."></button>
        <button class="meter" data-m="food" aria-label="Food. Tap for details."></button>
        <button class="meter" data-m="water" aria-label="Water. Tap for details."></button>
        <button class="meter" data-m="power" aria-label="Power. Tap for details."></button>
        <div class="mini food-sols" id="food-sols" role="status"><div class="mt"><span class="mic" data-ic="food"></span><span id="food-sols-t">FOOD: 180 Sols left</span></div><div class="bar"><i></i></div></div>
        <div class="mini food-sols truck-bar" id="truck-bar" role="status" hidden><div class="mt"><span class="mic" data-ic="battery"></span><span id="truck-bar-t">TRUCK: 2:00 left</span></div><div class="bar"><i></i></div></div>
        <div class="hud-resources">
          <div class="outside" id="energy-wrap"><div class="mini" id="en-m"><div class="mt"><span class="mic" data-ic="bulb"></span><span id="en-v">100</span></div><div class="bar"><i></i></div></div></div>
          <div class="outside" id="tank-wrap" hidden>
            <div class="mini" id="suit-m" title="Oxygen tank" aria-label="Oxygen tank"><div class="mt"><span class="mic" data-ic="suit"></span><span id="suit-v">100</span></div><div class="bar"><i></i></div></div>
          </div>
          <div class="outside" id="outside" hidden>
            <div class="mini" id="rad-m"><div class="mt"><span class="mic" data-ic="rad"></span><span id="rad-v">100</span></div><div class="bar"><i></i></div></div>
          </div>
          <button class="ctrl-btn" id="ctrl-btn" aria-label="Open Control Module"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="2"/><path d="M6 12l3-3 3 2 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>CONTROL</button>
        </div>
      </div>
    </header>
    <div id="stage">
      <div id="phaser"></div>
      <div id="radar" class="radar" role="img" aria-label="Radar showing your position and current objective">
        <div class="radar-map" aria-hidden="true">
          <span class="radar-poi" data-location="sick" style="left:12.2%;top:38.8%"></span>
          <span class="radar-poi" data-location="farm" style="left:14.9%;top:14.4%"></span>
          <span class="radar-poi" data-location="hatch" style="left:20.3%;top:38.8%"></span>
          <span class="radar-poi" data-location="control" style="left:32.4%;top:10%"></span>
          <span class="radar-poi" data-location="ls" style="left:50%;top:16%"></span>
          <span class="radar-poi" data-location="comms" style="left:50%;top:50.4%"></span>
          <span class="radar-poi" data-location="bands" style="left:73%;top:13.2%"></span>
          <span class="radar-poi" data-location="bike" style="left:80.8%;top:15.6%"></span>
          <span class="radar-poi" data-location="rower" style="left:89.2%;top:15.6%"></span>
          <span class="radar-poi" data-location="lab" style="left:75.7%;top:51.2%"></span>
          <span class="radar-poi" data-location="bath" style="left:90.5%;top:51.2%"></span>
          <span class="radar-poi" data-location="solar" style="left:40.5%;top:90.4%"></span>
          <span class="radar-poi" data-location="rover" style="left:82.4%;top:84%"></span>
          <span class="radar-poi" data-location="cave" style="left:94.6%;top:94%"></span>
          <span class="radar-poi" data-location="suit" style="left:32.4%;top:58.4%"></span>
          <span class="radar-target" id="radar-target"></span>
          <span class="radar-edge" id="radar-edge"></span>
          <span class="radar-player" id="radar-player"></span>
        </div>
      </div>
      <div class="sol-time" aria-label="Mars local time and Sol">
        <svg class="aclock" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/><line id="hh" x1="16" y1="16" x2="16" y2="9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><line id="mh" x1="16" y1="16" x2="16" y2="5" stroke="#ffb340" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="16" r="1.8" fill="currentColor"/></svg>
        <b id="clock">8:00 AM</b><span>Sol <b id="sol">1</b></span>
      </div>
      <div id="joy-base"></div><div id="joy-knob"></div>
      <div id="touch-hint" hidden>Tap to walk · tap a station to use it</div>
      <button id="act" hidden></button>
      <div id="toasts"></div>
      <div class="ep-bar" id="ep-bar" hidden>
        <div class="epm" id="epm-energy" role="meter" aria-label="Base energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="epm-top"><span class="ep-icon" data-ic="battery" aria-hidden="true"></span></div><div class="bar"><i></i></div></div>
        <div class="epm" id="epm-health" role="meter" aria-label="Your health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="epm-top"><span class="ep-icon" data-ic="heart" aria-hidden="true"></span></div><div class="bar"><i></i></div></div>
        <div class="epm" id="epm-hunger" role="meter" aria-label="Your hunger: full means fed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="epm-top"><span class="ep-icon" data-ic="food" aria-hidden="true"></span></div><div class="bar"><i></i></div></div>
        <div class="water-me" id="water-me" role="status" hidden><span class="ep-icon" data-ic="water" aria-hidden="true"></span><span id="water-me-text">WATER ME</span></div>
        <div class="epm" id="epm-tank" role="meter" aria-label="Oxygen tank" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" hidden><div class="epm-top"><span class="ep-icon" data-ic="suit" aria-hidden="true"></span></div><div class="bar"><i></i></div></div>
        <div class="epm" id="epm-morale" role="meter" aria-label="Team morale" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="epm-top mood-icons" id="epm-morale-icon" data-mood="neutral" aria-hidden="true"><span data-ic="neutral"></span></div><div class="bar"><i></i></div></div>
        <div class="epm solar-meter low" id="ep-alert" role="meter" aria-label="Solar Alert" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20"><div class="epm-top"><span class="ep-icon" data-ic="sun" aria-hidden="true"></span></div><div class="bar"><i></i></div></div>
      </div>
      <div class="ring" id="ring" hidden><button class="ring-ico" id="ring-btn" aria-label="Intercom is ringing: Captain Reyes is calling"><img src="/crew/reyes.png" alt=""><span>INTERCOM<br><b>CAPT. REYES</b></span></button></div>
    </div>
  </section>
  <div id="overlays"></div><!-- outside both screens so learning cards and the wiki also show over the menu -->
</div>
<div id="boot-fallback" class="boot-fallback" role="status" aria-label="Loading My Little Red Planet" aria-live="polite" hidden>
  <div class="boot-loader">
    <h2>My Little Red Planet</h2>
    <p>SETTING UP YOUR MARS MISSION</p>
    <div class="boot-progress" aria-hidden="true"><span></span></div>
  </div>
</div>
<script>
  (() => {
    const loader = document.getElementById('boot-fallback');
    const cover = new Image();
    const boot = window.__mrpBoot;
    const update = () => { if (loader) loader.hidden = !(boot.delayed && !(boot.appReady && boot.coverReady)); };
    boot.update = update;
    document.addEventListener('mrp-app-ready', () => { boot.appReady = true; update(); }, { once: true });
    cover.onload = () => { boot.coverReady = true; update(); };
    cover.onerror = () => { boot.coverReady = true; console.error('The menu cover image failed to load.'); update(); };
    cover.src = matchMedia('(max-width: 620px)').matches ? '/menu-cover-mobile.png' : '/menu-cover.png';
    update();
  })();
</script>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
